name: Forum RSS check

on:
  push:
    paths: ['.github/workflows/forum-check.yml']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Reddit RSS reachability for watchexchangecanada
        run: |
          UA="Mozilla/5.0 (Linux; Android 14; Pixel) AppleWebKit/537.36 Chrome/125.0 Mobile Safari/537.36"
          for u in \
            "https://www.reddit.com/r/watchexchangecanada/new/.rss?limit=25" \
            "https://www.reddit.com/r/watchexchangecanada.rss" \
            "https://old.reddit.com/r/watchexchangecanada/.rss" \
            "https://www.reddit.com/r/watchexchangecanada/new.json?limit=5" ; do
            code=$(curl -sL -A "$UA" "$u" -o /tmp/r.out -w "%{http_code}")
            bytes=$(wc -c < /tmp/r.out)
            entries=$(grep -oc '<entry>' /tmp/r.out 2>/dev/null || echo 0)
            echo "HTTP $code  ${bytes}B  entries=$entries  <- $u"
            if [ "$code" = "200" ] && [ "$entries" -gt 0 ]; then
              echo "   sample titles:"
              grep -oE '<title>[^<]*</title>' /tmp/r.out | sed -E 's/<[^>]*>//g' | head -4 | sed 's/^/     - /'
            fi
          done
