name: Forum RSS check

on:
  push:
    paths: ['.github/workflows/forum-check.yml']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe aggregators + forum feeds
        run: |
          UA="Mozilla/5.0 (Linux; Android 14; Pixel) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0 Mobile Safari/537.36"

          probe () {
            local label="$1"; local url="$2"
            code=$(curl -sL -A "$UA" "$url" -o /tmp/p.out -w "%{http_code}" --max-time 25)
            echo "[$label] HTTP $code  bytes=$(wc -c < /tmp/p.out)"
            echo "   head: $(head -c 80 /tmp/p.out | tr -d '\n\r')"
            echo "   panels(div.panel)=$(grep -o 'class="panel' /tmp/p.out | wc -l)  rss-items=$(grep -o '<item' /tmp/p.out | wc -l)  listing-links=$(grep -oE 'listing/[0-9]+' /tmp/p.out | sort -u | wc -l)"
            echo "   feed-hints: $(grep -oiE 'application/rss\+xml|/feed|\.rss|/rss|/api/' /tmp/p.out | sort -u | head -5 | tr '\n' ' ')"
            echo
          }

          echo "========== WatchPatrol (the aggregator the app is named for) =========="
          probe "watchpatrol home"        "https://www.watchpatrol.net/"
          probe "watchpatrol ?query=rolex" "https://www.watchpatrol.net/?query=rolex"

          echo "========== WatchRecon (forum sales aggregator) =========="
          probe "watchrecon home"   "https://watchrecon.com/"
          probe "watchrecon rss"    "https://watchrecon.com/rss"
          probe "watchrecon search" "https://watchrecon.com/search?query=rolex"

          echo "========== RolexForums vBulletin RSS =========="
          probe "rolexforums RSS f9"  "https://www.rolexforums.com/external.php?type=RSS2&forumids=9"
