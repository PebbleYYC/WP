name: Forum RSS check

on:
  push:
    paths: ['.github/workflows/forum-check.yml']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Frankfurter FX API (keyless)
        run: |
          UA="Mozilla/5.0 (Linux; Android 14; Pixel) AppleWebKit/537.36 Chrome/125.0 Mobile Safari/537.36"
          probe () {
            code=$(curl -sL -A "$UA" "$1" -o /tmp/fx.json -w "%{http_code}" --max-time 20)
            echo "[$1]"
            echo "  HTTP $code : $(head -c 300 /tmp/fx.json)"
            echo
          }
          probe "https://api.frankfurter.app/latest?base=CAD"
          probe "https://api.frankfurter.app/latest?from=USD&to=CAD"
          probe "https://api.frankfurter.dev/v1/latest?base=CAD"
