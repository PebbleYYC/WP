name: Forum RSS check

on:
  push:
    paths: ['.github/workflows/forum-check.yml']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify WatchRecon country=Canada filter
        run: |
          UA="Mozilla/5.0 (Linux; Android 14; Pixel) AppleWebKit/537.36 Chrome/125.0 Mobile Safari/537.36"
          fetch () { curl -sL -A "$UA" "$1" -o /tmp/p.html -w "HTTP %{http_code}\n"; }

          for u in \
            "https://watchrecon.com/?country%5B%5D=Canada" \
            "https://watchrecon.com/?country[]=Canada" \
            "https://watchrecon.com/?query=&country%5B%5D=Canada" ; do
            echo "=== $u ==="
            fetch "$u"
            echo "  galleryItems: $(grep -oc 'galleryItemContainer' /tmp/p.html || echo 0)"
            echo "  first 5 titles:"
            grep -oE '<div class="subjectInfo">.*?</div>' /tmp/p.html 2>/dev/null | sed -E 's/<[^>]*>//g' | head -5 | sed 's/^/    - /'
            echo "  location/flag hints (Canada mentions in feed):"
            grep -oic 'canada' /tmp/p.html || true
            echo
          done

          echo "=== compare: unfiltered homepage item count ==="
          fetch "https://watchrecon.com/"
          echo "  galleryItems: $(grep -oc 'galleryItemContainer' /tmp/p.html || echo 0)"
